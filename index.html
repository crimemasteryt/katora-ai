<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Katora AI is an open-source project exploring AI-powered developer tools.">
<title>Katora AI — AI Developer Assistant</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#080b14;color:#f5f7ff;line-height:1.6}
header{padding:20px 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #242a3c}
.logo{font-size:25px;font-weight:bold;color:#a78bfa}
nav a{color:#ddd;text-decoration:none;margin-left:18px;font-size:14px}
.hero{text-align:center;padding:100px 20px 75px;background:radial-gradient(ellipse at top,#25204c,#080b14 70%)}
.badge{display:inline-block;border:1px solid #6654a5;padding:7px 14px;border-radius:30px;color:#c4b5fd;font-size:13px}
h1{font-size:clamp(38px,8vw,68px);line-height:1.1;margin:25px 0}
h1 span{color:#a78bfa}
.hero p{max-width:650px;margin:0 auto 28px;color:#b9bfd1;font-size:17px}
.btn{display:inline-block;padding:13px 22px;background:#8b5cf6;color:white;text-decoration:none;border-radius:9px;font-weight:bold;margin:5px}
.btn.secondary{background:transparent;border:1px solid #55516e}
section{padding:65px 7%;max-width:1100px;margin:auto}
section h2{text-align:center;font-size:32px;margin-bottom:15px}
.int
